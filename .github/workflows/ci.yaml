name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzar el pipeline a mano (pestaña Actions) o desde n8n (flujo 2)
  workflow_dispatch:
    inputs:
      motivo:
        description: "Quién o qué lanzó la ejecución (por ejemplo: n8n)"
        required: false
        default: "manual"
        type: string

# El pipeline solo necesita leer el código
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    outputs:
      ruff_hallazgos: ${{ steps.salidas.outputs.ruff_hallazgos }}
      pruebas_fallidas: ${{ steps.salidas.outputs.pruebas_fallidas }}

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check . --output-format=github

      # !cancelled(): aunque Ruff falle, las pruebas corren igual, para que el resumen tenga todo
      - name: Ruff (formato)
        if: ${{ !cancelled() }}
        run: ruff format --check .

      - name: Pruebas unitarias y de API
        if: ${{ !cancelled() }}
        run: python -m pytest tests -v --junitxml=reports/pytest.xml

      - name: Datos para el resumen
        id: salidas
        if: ${{ !cancelled() }}
        run: |
          echo "ruff_hallazgos=$(ruff check . --output-format=json --exit-zero | python scripts/ci_salidas.py contar)" >> "$GITHUB_OUTPUT"
          echo "pruebas_fallidas=$(python scripts/ci_salidas.py fallidas reports/pytest.xml)" >> "$GITHUB_OUTPUT"

  e2e:
    name: Pruebas end-to-end
    runs-on: ubuntu-latest
    outputs:
      pruebas_fallidas: ${{ steps.salidas.outputs.pruebas_fallidas }}

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias y navegador
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Construir y levantar la app
        # --wait espera a que el healthcheck del compose diga "healthy"
        run: docker compose up --build -d --wait

      - name: Playwright
        run: >
          python -m pytest tests_e2e -v
          --base-url http://localhost:8000
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results
          --junitxml=reports/e2e.xml

      - name: Datos para el resumen
        id: salidas
        if: ${{ !cancelled() }}
        run: echo "pruebas_fallidas=$(python scripts/ci_salidas.py fallidas reports/e2e.xml)" >> "$GITHUB_OUTPUT"

      - name: Logs de la app (si algo falló)
        if: failure()
        run: docker compose logs

      - name: Guardar trazas y capturas (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-evidencia
          path: test-results/
          retention-days: 7

      - name: Apagar la app
        if: always()
        run: docker compose down

  zap:
    name: Seguridad dinámica (ZAP)
    runs-on: ubuntu-latest
    outputs:
      alertas: ${{ steps.salidas.outputs.alertas }}

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Construir y levantar la app
        run: docker compose up --build -d --wait

      - name: Preparar carpeta de trabajo de ZAP
        # El contenedor de ZAP corre con otro usuario: necesita permiso para escribir los reportes
        run: |
          mkdir -p reports/zap
          cp .zap/rules.tsv reports/zap/
          chmod -R a+rwx reports/zap

      - name: Escaneo de la API con ZAP
        # -f openapi: ZAP lee el OpenAPI para conocer todos los endpoints y sus parámetros
        # -c rules.tsv: la política (FAIL / WARN / IGNORE) de cada alerta
        # -I: las alertas WARN no rompen el pipeline; solo las FAIL
        run: >
          docker run --rm --network host
          -v "$PWD/reports/zap:/zap/wrk:rw"
          ghcr.io/zaproxy/zaproxy:stable
          zap-api-scan.py
          -t http://localhost:8000/openapi.json
          -f openapi
          -c rules.tsv
          -r zap-reporte.html
          -J zap-reporte.json
          -I

      - name: Datos para el resumen
        id: salidas
        if: ${{ !cancelled() }}
        run: echo "alertas=$(python3 scripts/ci_salidas.py zap reports/zap/zap-reporte.json .zap/rules.tsv)" >> "$GITHUB_OUTPUT"

      - name: Guardar reportes de ZAP
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-reportes
          path: |
            reports/zap/zap-reporte.html
            reports/zap/zap-reporte.json
          retention-days: 7

      - name: Logs de la app (si algo falló)
        if: failure()
        run: docker compose logs

      - name: Apagar la app
        if: always()
        run: docker compose down

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código con todo el historial
        uses: actions/checkout@v5
        with:
          # Un secreto borrado en un commit posterior sigue en el historial: hay que revisarlo completo
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El token del pipeline es de solo lectura; los comentarios en el PR los hará n8n
          GITLEAKS_ENABLE_COMMENTS: false

  veredicto:
    name: Veredicto
    # Espera a las cuatro etapas y corre aunque alguna haya fallado
    needs: [calidad, e2e, zap, secretos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Generar resumen.json
        # Los datos llegan por variables de entorno, nunca escritos dentro del script:
        # el nombre de la rama y el motivo los controla quien lanza la ejecución.
        env:
          NEEDS: ${{ toJSON(needs) }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          python3 scripts/resumen.py generar > resumen.json
          cat resumen.json

      - name: Guardar resumen.json
        uses: actions/upload-artifact@v6
        with:
          name: resumen
          path: resumen.json
          retention-days: 30

      - name: Decidir
        run: python3 scripts/resumen.py verificar resumen.json
